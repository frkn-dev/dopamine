# Local subnet exclusions (Settings -> Local subnets): these subnets keep
# going out of the physical interface instead of the tunnel, so they must
# also bypass the kill switch. The anchor sits after 120.blockNets and
# 250.blockIPv6 on purpose: an explicitly excluded subnet wins even when it
# overlaps a blocked range or is IPv6.
table <excludedsubnets> {}
pass out to <excludedsubnets> flags any no state
